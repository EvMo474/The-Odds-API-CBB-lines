name: pull-halftime-lines
# SPENDS ODDS API CREDITS (10 per snapshot moment).  mode=plan spends nothing and prints the cost per season.
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'plan (spends nothing) | all', default: 'plan' }
      seasons: { description: 'comma list, pulled in this order (2026 = 2025-26)', default: '2026,2024,2023,2022,2025' }
      gap: { description: 'minimum first-half FG% gap', default: '10' }
      budget: { description: 'most credits to spend in THIS run', default: '40000' }
      reserve: { description: 'stop if remaining credits fall below this (room for the live logger to Dec 1)', default: '3000' }
      include_neutral: { description: 'include neutral-site games (true/false)', default: 'true' }
      fill_pregame: { description: 'seasons whose games have no closing line: fetch it from the API (e.g. 2025), or all', default: '2025' }
concurrency:
  group: cbb-halftime-pull
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas pyarrow requests numpy
      - name: pull
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          NEUT=""; if [ "${{ github.event.inputs.include_neutral }}" = "true" ]; then NEUT="--include-neutral"; fi
          python backtest/pull_halftime_lines.py --mode "${{ github.event.inputs.mode }}" --seasons "${{ github.event.inputs.seasons }}" \
            --gap "${{ github.event.inputs.gap }}" --budget "${{ github.event.inputs.budget }}" --min-credits "${{ github.event.inputs.reserve }}" \
            --fill-pregame "${{ github.event.inputs.fill_pregame }}" $NEUT --out backtest/out
      - name: save results
        if: always()
        run: |
          git config user.name "cbb-backtest"; git config user.email "cbb-backtest@users.noreply.github.com"
          git add backtest/out
          git commit -m "halftime lines pull $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 10; done
